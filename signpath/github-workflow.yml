name: build-and-sign

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

env:
  QT_VERSION: "6.5.3"
  CMAKE_GENERATOR: "MinGW Makefiles"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python（aqtinstall 用）
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Qt ${{ env.QT_VERSION }} (mingw) + Multimedia
        run: |
          python -m pip install --quiet aqtinstall
          python -m aqt install-qt windows desktop ${{ env.QT_VERSION }} win64_mingw --outputdir C:\Qt
          python -m aqt install-qt windows desktop ${{ env.QT_VERSION }} win64_mingw -m qtmultimedia --noarchives --outputdir C:\Qt

      - name: 配置 & 编译
        shell: pwsh
        run: |
          $qt = "C:\Qt\${{ env.QT_VERSION }}\mingw_64"
          $mingw = (Get-ChildItem "C:\Qt\Tools" -Directory | Where-Object { $_.Name -like "mingw*_64" } | Select-Object -First 1).FullName + "\bin"
          $env:PATH = "$mingw;$qt\bin;$env:PATH"
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_PREFIX_PATH="$qt" -DCMAKE_BUILD_TYPE=Release -DCJI_BUILD_TESTS=ON
          cmake --build build -j 8

      - name: 跑测试
        shell: pwsh
        run: |
          cd build
          .\flowpath_test.exe
          .\core_tests.exe
          .\backup_smoke.exe
          .\payload_test.exe .\packer.exe

      - name: 打包（未签名）
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1 -Version ${{ github.ref_name }}

      - name: 上传未签名产物（临时）
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-artifacts
          path: |
            dist/Cjibackup_Setup_*.exe
            dist/Cjibackup_*_portable.zip
          if-no-files-found: error

      # ------------------------------------------------------------------
      # SignPath 开源签名：审批通过、配置好 secrets 后，把下面的 if 改成 always()
      # 需要的 secrets：SIGNPATH_API_TOKEN、SIGNPATH_ORGANIZATION_ID
      # ------------------------------------------------------------------
      - name: 提交 SignPath 签名
        if: ${{ false }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: cjibackup
          signing-policy-slug: release-signing
          artifact-configuration-slug: cjibackup-binaries
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: 上传签名后的产物
        if: ${{ false }}
        uses: actions/upload-artifact@v4
        with:
          name: signed-artifacts
          path: signed/**
